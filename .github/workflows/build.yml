# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        required: false
        description: Publish built mod file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew buildAndCollect

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  prepare_publish_matrix:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts

      - name: Decompress artifacts
        uses: somaz94/compress-decompress@v1
        with:
          command: decompress
          source: ./Artifacts.zip

      - name: Convert metadata to matrix data
        uses: actions/github-script@v8
        id: set-matrix
        with:
          script: |
            require("fs").readdir("publish", null, (err, files) => {
              if (err) {
                throw err;
              }
              const path = require("path");
            
              const parsedData = files
                .map((name) => path.join("publish", name))
                .map((path) => {
                  const obj = {};
                  fs.readFileSync(path)
                    .toString()
                    .split(/\n/)
                    .map((line) => line.split("=", 2))
                    .forEach(([k, v]) => (obj[k] = v));
                  return obj;
                });
            
              core.setOutput("matrix_data", JSON.stringify(parsedData));
            });

  publish:
    if: ${{ inputs.publish }}
    needs: prepare_publish_matrix
    strategy:
      # id, version, name, group, platform, mc_version, file_name
      matrix: ${{ fromJson(needs.prepare_publish_matrix.outputs.matrix_data) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts

      - name: Decompress artifacts
        uses: somaz94/compress-decompress@v1
        with:
          command: decompress
          source: ./Artifacts.zip

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Only include this section if you wish to publish your assets on Modrinth.
          # modrinth-id: AAbbccDD
          # modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Only include this section if you wish to publish your assets on CurseForge.
          # curseforge-id: 123456
          # curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Only include this section if you wish to publish your assets on GitHub.
          # github-token: ${{ secrets.GITHUB_TOKEN }}

          files: ${{ format('{0}/{1}/{2}', matrix.verion, matrix.platform, matrix.file_name) }}
          name: ${{ format('{0} {1} {2}', matrix.name, matrix.version, matrix.platform) }}
          version: ${{ matrix.version }}
          game-versions: ${{ matrix.mc_version }}